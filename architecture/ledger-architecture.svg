<svg xmlns="http://www.w3.org/2000/svg" width="1105" height="650" viewBox="0 0 1105 650" role="img" aria-labelledby="title desc"><title id="title">Ledger API architecture</title><desc id="desc">REST and payment messages enter the same ledger write service. MySQL commits ledger state and an outbox record together. The outbox publisher announces committed transactions through the broker.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0d766d"/></marker></defs><rect width="1105" height="650" fill="#f0f6f5"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="54" fill="#102d37" font-size="34" font-weight="700">Ledger API architecture</text><text x="40" y="86" fill="#385760" font-size="17">Proposed design · Double-entry accounting and reliable event delivery</text><rect x="40" y="135" width="255" height="115" rx="12" fill="#fff" stroke="#9abbb8"/><text x="57" y="167" font-size="18" font-weight="700" fill="#102d37">REST clients</text><text x="57" y="195" font-size="14" fill="#284b56">Open / read accounts</text><text x="57" y="218" font-size="14" fill="#284b56">Post / read / reverse transactions</text><rect x="40" y="310" width="255" height="115" rx="12" fill="#fff" stroke="#9abbb8"/><text x="57" y="342" font-size="18" font-weight="700" fill="#102d37">Payment system → broker</text><text x="57" y="370" font-size="14" fill="#284b56">payment-settled event</text><text x="57" y="393" font-size="14" fill="#284b56">Retry transient failures</text><rect x="355" y="135" width="270" height="115" rx="12" fill="#fff" stroke="#9abbb8"/><text x="372" y="167" font-size="18" font-weight="700" fill="#102d37">Spring Boot 4 REST API</text><text x="372" y="195" font-size="14" fill="#284b56">Java 17 · multiple instances</text><text x="372" y="218" font-size="14" fill="#284b56">Validate request and retry key</text><rect x="355" y="310" width="270" height="115" rx="12" fill="#fff" stroke="#9abbb8"/><text x="372" y="342" font-size="18" font-weight="700" fill="#102d37">Settlement consumer</text><text x="372" y="370" font-size="14" fill="#284b56">Map settlement debit + merchant credit</text><text x="372" y="393" font-size="14" fill="#284b56">Route invalid messages to a DLQ</text><rect x="685" y="135" width="380" height="290" rx="12" fill="#d8f2ec" stroke="#9abbb8"/><text x="702" y="167" font-size="18" font-weight="700" fill="#102d37">Ledger write service</text><text x="702" y="195" font-size="14" fill="#284b56">Exact integer minor units · EUR / USD / JPY</text><text x="702" y="227" font-size="14" fill="#284b56">Deduplicate API writes and payment IDs</text><text x="702" y="259" font-size="14" fill="#284b56">Lock account rows in ascending ID order</text><text x="702" y="291" font-size="14" fill="#284b56">Validate balanced entries and overdrafts</text><text x="702" y="323" font-size="14" fill="#284b56">Append immutable entries and reversals</text><text x="702" y="355" font-size="14" fill="#284b56">Commit balances, dedup state and outbox together</text><rect x="685" y="475" width="380" height="120" rx="12" fill="#fff" stroke="#9abbb8"/><text x="702" y="507" font-size="18" font-weight="700" fill="#102d37">MySQL</text><text x="702" y="535" font-size="14" fill="#284b56">Accounts · transactions · entries</text><text x="702" y="558" font-size="14" fill="#284b56">Idempotency · payment IDs · outbox</text><rect x="355" y="475" width="270" height="120" rx="12" fill="#fff" stroke="#9abbb8"/><text x="372" y="507" font-size="18" font-weight="700" fill="#102d37">Outbox publisher</text><text x="372" y="535" font-size="14" fill="#284b56">Retry until broker confirms</text><text x="372" y="558" font-size="14" fill="#284b56">At-least-once · no global ordering</text><rect x="40" y="475" width="255" height="120" rx="12" fill="#fff" stroke="#9abbb8"/><text x="57" y="507" font-size="18" font-weight="700" fill="#102d37">Broker → other services</text><text x="57" y="535" font-size="14" fill="#284b56">transaction-recorded event</text><text x="57" y="558" font-size="14" fill="#284b56">Deduplicate by transaction ID</text><g stroke="#0d766d" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M296 192H351"/><path d="M626 192H681"/><path d="M296 367H351"/><path d="M626 367H681"/><path d="M875 426V471"/><path d="M684 535H629"/><path d="M354 535H299"/></g><text x="40" y="628" fill="#385760" font-size="14">Account and transaction reads use committed MySQL state.</text></g></svg>
