services:
  ledger:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080;
          printf 'GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          read -r status <&3;
          [[ "$$status" == *" 200 "* ]]
      interval: 5s
      timeout: 4s
      retries: 30
    environment:
      LEDGER_DB_URL: jdbc:mysql://mysql:3306/ledger
      LEDGER_RABBIT_HOST: rabbitmq
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  account-tests:
    profiles: [test]
    build:
      context: .
      target: build
    command: ["mvn", "-B", "-Dtest=*IntegrationTest", "test"]
    environment:
      LEDGER_MYSQL_TEST: 'true'
      LEDGER_BROKER_TEST: 'true'
      LEDGER_DB_URL: jdbc:mysql://mysql:3306/ledger
      LEDGER_RABBIT_HOST: rabbitmq
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ledger
      MYSQL_USER: ledger
      MYSQL_PASSWORD: ledger-local
      MYSQL_ROOT_PASSWORD: root-local
    volumes:
      - ledger-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
  rabbitmq:
    image: rabbitmq:4.2-management
    hostname: rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ledger
      RABBITMQ_DEFAULT_PASS: ledger-local
    volumes:
      - ledger-rabbit:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  ledger-db:
  ledger-rabbit:
